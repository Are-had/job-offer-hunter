<!DOCTYPE html>
<html>
<head>
    <title>Open Multiple Tabs</title>
</head>
<body>
    <script>
        // Arezki: research, theses, Earth observation, climate and space
        const urls = [
            // Thesis and PhD-level offers (ABG)
            'https://abg.asso.fr/en/recruitment/thesis-topic/computer-science',
            'https://abg.asso.fr/en/recruitment/thesis-topic/data-science-storage-security-measurement-analysis',
            'https://abg.asso.fr/en/recruitment/thesis-topic/engineering-sciences',
            'https://abg.asso.fr/fr/recrutement/sujet-de-these/mathematiques',

            // Space, ocean and climate
            'https://cnes.fr/offres-emploi',
            'https://www.mercator-ocean.eu/about-us/work-with-us/careers/',
        ];

        urls.forEach(url => window.open(url, '_blank'));
    </script>
</body>
</html>
